@if (user()) {
  <div class="avatar">
    @if (user()!.profilePictureURL && !imageFailed()) {
      <img class="avatar__image" [src]="user()!.profilePictureURL" alt="" loading="lazy" (error)="imageFailed.set(true)" />
    } @else {
      <app-icon class="avatar__icon" name="ghost" />
    }
  </div>
}
