<div class="settings-header">
  <app-icon (click)="navigateTo('main')" name="back" />
  <h3>Sprache</h3>
</div>

<div class="settings-section">
  @for (lang of languages; track lang.code) {
    <button class="setting-item" (click)="selectLanguage(lang.code)">
      <div class="setting-item-content">
        <img [src]="lang.flag" alt="" class="flag-icon" />
        <span>{{ lang.label }}</span>
      </div>

      @if (translate.currentLang() === lang.code) {
        <div class="radio-indicator checked">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
      } @else {
        <div class="radio-indicator"></div>
      }
    </button>
  }
</div>
