<div class="settings-header">
  <app-icon (click)="goBack()" name="back" />
  <h3>{{ 'settings.personalDetails.title' | translate }}</h3>
  <button class="btn-primary" [disabled]="isLoading()" (click)="saveEmail()">
    @if (isLoading()) {
      {{ 'settings.personalDetails.saving' | translate }}
    } @else {
      {{ 'settings.personalDetails.save' | translate }}
    }
  </button>
</div>

<div class="settings-body">
  <div class="settings-section edit-profile-section">

    @if (errorMessage()) {
      <div class="error-banner">
        {{ errorMessage() }}
      </div>
    }

    <div class="setting-item email-edit-item">
      <label for="email-input">{{ 'settings.personalDetails.emailLabel' | translate }}</label>
      <input id="email-input" type="email" [(ngModel)]="emailInput" [placeholder]="'settings.personalDetails.emailPlaceholder' | translate" />
    </div>

    @if (requiresReauth()) {
      <div class="setting-item email-edit-item" style="margin-top: 12px;">
        <label for="password-input">{{ 'settings.personalDetails.currentPasswordLabel' | translate }}</label>
        <input id="password-input" type="password" [(ngModel)]="currentPasswordInput" [placeholder]="'settings.personalDetails.passwordPlaceholder' | translate" />
      </div>
    }
  </div>
</div>
