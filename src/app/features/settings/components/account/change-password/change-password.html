<div class="settings-header">
  <app-icon (click)="goBack()" name="back" />
  <h3>Passwort ändern</h3>
  <button class="btn-primary" type="submit"
          [attr.form]="!isReauthenticated() ? 'currentPasswordForm' : 'newPasswordForm'" [disabled]="isLoading()">
    @if (isLoading()) {
      Wird gespeichert...
    } @else {
      Speichern
    }
  </button>
</div>

<!-- SUCCESS MESSAGE (Shown on success, independent of active step) -->
@if (successMessage()) {
  <p class="success-message">{{ successMessage() }}</p>
}

<!-- STEP 1: Ask for current password first -->
<div class="settings-body">
  @if (!isReauthenticated()) {
    <form id="currentPasswordForm" (submit)="verifyCurrentPassword(); $event.preventDefault()" class="password-form">
      <div class="form-group">
        <label for="currentPassword">Aktuelles Passwort</label>
        <input type="password" id="currentPassword" [(ngModel)]="currentPasswordInput" name="currentPasswordInput"
               required />
      </div>

      @if (errorMessage()) {
        <p class="error-message">{{ errorMessage() }}</p>
      }
    </form>
  } @else {
    <!-- STEP 2: Hide old password, show new password & confirmation fields -->
    <form id="newPasswordForm" (submit)="updateNewPassword(); $event.preventDefault()" class="password-form">
      <div class="form-group">
        <label for="newPassword">Neues Passwort</label>
        <input type="password" id="newPassword" [(ngModel)]="newPassword" name="newPassword" required />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Neues Passwort bestätigen</label>
        <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" required />
      </div>

      @if (errorMessage()) {
        <p class="error-message">{{ errorMessage() }}</p>
      }
    </form>
  }

  <div class="settings-section">
    <div class="setting-item">Formular für Passwortänderung...</div>
  </div>
</div>
