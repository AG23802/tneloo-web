<div class="feed">

  @if (isLoading()) {
    <div class="loading">
      {{ 'home.loadingProfiles' | translate }}
    </div>
  }

  @for (user of users(); track user.uid) {
    <app-card [user]="user" />
  }

  <!-- Load More Section / End Message -->
  <div class="feed-footer" style="text-align: center; padding: 2rem;">
    @if (hasMorePhotos()) {
      <button class="load-more-btn" (click)="loadMorePhotos()" [disabled]="isLoadingMore()">
        @if (isLoadingMore()) {
          {{ 'home.loading' | translate }}
        } @else {
          {{ 'home.loadMore' | translate }}
        }
      </button>
    } @else {
      <p class="end-message" style="color: gray; font-weight: 500;">
        {{ 'home.seenAllFiles' | translate }}
      </p>
    }
  </div>

</div>
