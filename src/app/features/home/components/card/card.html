<article class="profile-card">
  <header class="profile-card__header" (click)="openProfile()">
    <app-avatar [url]="user()?.profilePictureURL" />
    <div class="profile-card__user-info">
      <h2 class="profile-card__name">{{ user().displayName }}</h2>
      <p class="profile-card__location">AG</p>
    </div>
  </header>
  <app-media-slider [media]="user().content" [user]="user()" />
  <app-card-actions />
</article>
