<div class="photo-slider" (scroll)="onGalleryScroll($event)">
  @for (photo of photos(); track $index) {
    <div class="photo-wrapper">
      @if (failedImages.has($index)) {
        <div class="photo-error">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <path d="M21 15l-5-5L5 21" />
            <line x1="4" y1="4" x2="20" y2="20" />
          </svg>


          <span>
            {{ 'photoSlider.imageUnavailable' | translate }}
          </span>
        </div>
      } @else {
        <img [src]="photo.url" [loading]="$index === 0 ? 'eager' : 'lazy'" alt="" (error)="imageFailed($index)" />
      }
    </div>
  }
</div>

@if (photos().length > 1) {
  <div class="photo-dots">
    @for (photo of photos(); track $index; let i = $index) {
      <span class="dot" [class.active]="getCurrentSlide() === i"></span>
    }
  </div>
}
