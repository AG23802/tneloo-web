<div class="modal-backdrop">
  <div class="preview-modal">
    <h3>Preview Photo</h3>
    <div class="preview-image-container">
      <img [src]="previewUrlInput()" alt="Preview" />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" (click)="cancelPreview()" [disabled]="isUploading()">Cancel</button>
      <button class="btn-save" (click)="savePhoto()" [disabled]="isUploading()">
        @if (isUploading()) {
          Uploading...
        } @else {
          Save
        }
      </button>
    </div>
  </div>
</div>
