<div class="upload-container">
  <button class="nav-icon-btn upload-trigger-btn" (click)="triggerUpload()" [title]="'profile.uploadMedia' | translate">
    <app-icon name="camera" />
  </button>

  <input #fileInput type="file" hidden [attr.accept]="accept()" (change)="onFilesSelected($event)" />
</div>
