<div class="settings-container">
  <div class="settings-header">
    <app-icon (click)="goBack.emit()" name="back" />
    <h3>{{ 'profile.editProfile.title' | translate }}</h3>
    <button class="btn-primary" (click)="onSave()" [disabled]="isSaving()">
      @if (isSaving()) {
        {{ 'profile.editProfile.saving' | translate }}
      } @else {
        {{ 'profile.editProfile.save' | translate }}
      }
    </button>
  </div>

  @if (errorMessage()) {
    <div class="error-banner">
      {{ errorMessage() }}
    </div>
  }

  <div class="settings-section edit-profile-section">
    <div class="edit-field">
      <label>{{ 'profile.editProfile.displayNameLabel' | translate }}</label>
      <input type="text" [value]="displayName()" (input)="onNameChange($event)" [placeholder]="'profile.editProfile.displayNamePlaceholder' | translate" />
    </div>

    <div class="edit-field">
      <label>{{ 'profile.editProfile.usernameLabel' | translate }}</label>
      <input type="text" [value]="username()" (input)="onUserameChange($event)" [placeholder]="'profile.editProfile.usernamePlaceholder' | translate" />
    </div>

    <div class="edit-field">
      <label>{{ 'profile.editProfile.bioLabel' | translate }}</label>
      <textarea [value]="description()" (input)="onDescriptionChange($event)"
                [placeholder]="'profile.editProfile.bioPlaceholder' | translate"></textarea>
    </div>
  </div>
</div>
