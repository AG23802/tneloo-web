<form class="chat-input-form" (submit)="$event.preventDefault(); handleSendMessage()">
  <button type="button" class="chat-input-attach-btn" (click)="triggerMediaPicker()" [disabled]="isUploadingMedia()">
    <app-icon name="camera" />
  </button>
  <input #mediaInput type="file" hidden accept="image/*,video/*" (change)="onMediaSelected($event)" />

  <input
    type="text"
    [(ngModel)]="newMessageText"
    name="newMessageText"
    [placeholder]="'chats.typeMessage' | translate"
    autocomplete="off"
  />
  <button type="submit" [disabled]="!newMessageText || !newMessageText.trim()">
    <app-icon name="share" />
  </button>
</form>
