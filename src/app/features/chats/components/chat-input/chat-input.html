<div class="chat-input-wrapper">
  @if (pendingPreviewUrl(); as previewUrl) {
    <div class="chat-input-pending-media">
      @if (isPendingVideo()) {
        <video [src]="previewUrl" muted></video>
      } @else {
        <img [src]="previewUrl" alt="" />
      }
      <button type="button" class="chat-input-pending-media__remove" (click)="removePendingMedia()" [disabled]="isSending()">
        <app-icon name="close" [size]="14" />
      </button>
    </div>
  }

  <form class="chat-input-form" (submit)="$event.preventDefault(); handleSendMessage()">
    <button type="button" class="chat-input-attach-btn" (click)="triggerMediaPicker()" [disabled]="isSending()">
      <app-icon name="camera" />
    </button>
    <input #mediaInput type="file" hidden accept="image/*,video/*" (change)="onMediaSelected($event)" />

    <input
      type="text"
      [ngModel]="newMessageText()"
      (ngModelChange)="newMessageText.set($event)"
      name="newMessageText"
      [placeholder]="'chats.typeMessage' | translate"
      autocomplete="off"
      [disabled]="isSending()"
    />
    <button type="submit" [disabled]="!canSend()">
      <app-icon name="share" />
    </button>
  </form>
</div>
