<app-chat-header (event)="onBackClicked()" [user]="user()" />

<div class="chat-messages" #scrollContainer>
  @for (msg of chatService.messages(); track msg.id) {
    <div class="message-row" [class.outgoing]="msg.uid === currentUid()" [class.incoming]="msg.uid !== currentUid()">
      <div class="message-bubble">
        <p>{{ msg.text }}</p>
      </div>
    </div>
  }
</div>

<app-chat-input />
