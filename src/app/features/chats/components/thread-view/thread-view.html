<app-chat-header (event)="onBackClicked()" [user]="user()" />
@let counter = 0;
<div class="chat-messages" #scrollContainer (scroll)="onContainerScroll($event)">
  {{ chatService.messages().length }}
  @for (msg of chatService.messages(); track msg.id || $index) {
    <div class="message-row-wrapper">
      <!-- Timestamp positioned behind the row, shown when swiped -->
      <div class="message-timestamp" [class.visible]="activeMessageId() === msg.id">
        {{ msg.createdAt?.toDate() | date:'shortTime' }}
      </div>

      <div class="message-row"
           [class.outgoing]="msg.uid === currentUid()"
           [class.incoming]="msg.uid !== currentUid()"
           [style.transform]="'translateX(' + (messageOffsets()[msg.id!] || 0) + 'px)'"
           (touchstart)="onTouchStart(msg.id, $event)"
           (touchmove)="onTouchMove($event)"
           (touchend)="onTouchEnd()">

        <div class="message-bubble">
          {{ $index }}
          <p>{{ msg.text }}</p>
        </div>
      </div>
    </div>
  }
</div>

<app-chat-input (messageSent)="scrollToBottom()" />
