<div class="auth-container">
  <div class="auth-header">
    <h3>Welcome</h3>
  </div>

  <div class="auth-section">
    <div class="auth-item auth-intro-item">
      <div class="auth-item-content">
        <div>
          <strong>Share what matters</strong>
          <p class="auth-subtitle">Post updates, discover people, and keep up with your community.</p>
        </div>
      </div>
    </div>

    <!-- Firebase Error Banner -->
    @if (authService.errorMessage()) {
      <div class="error-banner">
        {{ authService.errorMessage() }}
      </div>
    }

    <!-- Signal Forms inputs mapped via formField -->
    <div class="auth-input-group">
      <input class="auth-input-item" type="email" [formField]="authForm.email" placeholder="Email" />
      <input class="auth-input-item" type="password" [formField]="authForm.password" placeholder="Password" />
    </div>

    <button class="auth-item" [disabled]="authService.interactionInProgress()" (click)="onLogin()">
      <div class="auth-item-content">
        <span>{{ authService.interactionInProgress() ? 'Opening sign in…' : 'Log in' }}</span>
      </div>
      <span class="forward-icon">‹</span>
    </button>

    <button class="auth-item auth-register-item" [disabled]="authService.interactionInProgress()"
            (click)="onRegister()">
      <div class="auth-item-content">
        <span class="register-text">Create new account</span>
      </div>
      <span class="forward-icon">‹</span>
    </button>
  </div>
</div>
